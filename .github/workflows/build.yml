name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Prepare Folder and Build APK
      run: |
        mkdir -p dist
        cp index.html dist/
        
        # Core packages aur plugins install ho rahe hain jo uploads handle karenge
        npm install @capacitor/core @capacitor/cli
        npm install @awesome-cordova-plugins/core @ionic-native/chooser
        
        npx cap init "AnsSheet Scanner" "com.xyz12.anssheetscannerapp" --web-dir=dist
        npx cap add android
        
        # Android native core settings permissions fix
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
        
        # Webview config to allow file access inside app
        sed -i '/public void onCreate/a \    this.settings.setAllowFileAccess(true);\n    this.settings.setAllowContentAccess(true);' android/app/src/main/java/com/xyz12/anssheetscannerapp/MainActivity.java || true

        npx cap sync
        cd android && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: anssheet-scanner-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
