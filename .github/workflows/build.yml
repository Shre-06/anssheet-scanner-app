name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Prepare dist folder
      run: |
        mkdir -p dist
        cp index.html dist/

    - name: Init and add Android
      run: |
        npx cap init "AnsSheet Scanner" "com.xyz12.anssheetscannerapp" --web-dir=dist
        npx cap add android

    - name: Fix AndroidManifest permissions
      run: |
        sed -i 's|</manifest>|    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>|' android/app/src/main/AndroidManifest.xml

    - name: Fix MainActivity for file upload + camera
      run: |
        cat > android/app/src/main/java/com/xyz12/anssheetscannerapp/MainActivity.java << 'EOF'
        package com.xyz12.anssheetscannerapp;

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                WebView webView = getBridge().getWebView();
                WebSettings settings = webView.getSettings();

                // ✅ Enable all file and content access
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                settings.setAllowFileAccessFromFileURLs(true);
                settings.setAllowUniversalAccessFromFileURLs(true);
                settings.setDomStorageEnabled(true);
                settings.setJavaScriptEnabled(true);
                settings.setMediaPlaybackRequiresUserGesture(false);
            }
        }
        EOF

    - name: Sync Capacitor
      run: npx cap sync

    - name: Build APK
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: anssheet-scanner-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
