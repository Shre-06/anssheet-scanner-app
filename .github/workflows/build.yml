name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js (Latest Stable)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install and Build Android Native
      run: |
        npm install --no-audit --no-fund
        npx cap init "AnsSheet Scanner" "com.xyz12.anssheetscannerapp" --web-dir=. --confirm
        npx cap add android
        npx cap sync
        cd android && ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: anssheet-scanner-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
